<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Enlace a tu archivo de estilos compartido -->
    <link rel="stylesheet" href="../css/estilos.css">
    <title>NELL - Inicio Estudiante</title>
</head>
<body>

    <!-- 1. Menú de navegación (Igual al estilo de tu maestra) -->
    <nav id="menuPrincipal">
        <a class="opcionMenuPrincipal" href="inicioEstudiante.html">Inicio</a>
        <a class="opcionMenuPrincipal" href="#">Perfil</a>
        <a class="opcionMenuPrincipal" href="#">Historial</a>
    </nav>

    <!-- 2. Sección del Buscador (Hecho con formularios básicos) -->
    <section class="seccion-buscador">
        <h2>Encuentra tu hogar universitario</h2>
        
        <form class="formulario-busqueda">
            <div class="campo">
                <label>Buscar por universidad cerca</label>
                <input type="text">
            </div>

            <div class="campo">
                <label>Precio maximo</label>
                <input type="text">
            </div>

            <div class="campo">
                <label>Tipo de vivienda</label>
                <select>
                    <option>Seleccionar...</option>
                    <option>Casa</option>
                    <option>Departamento</option>
                </select>
            </div>

            <div class="campo">
                <label>Genero</label>
                <select>
                    <option>Todos</option>
                    <option>Mixto</option>
                </select>
            </div>

            <button type="submit" class="btn-buscar">Buscar</button>
        </form>
    </section>

    <!-- 3. Sección de Tarjetas de Vivienda (Estructura sencilla con cajas div) -->
    <section class="contenedor-tarjetas">
        
        <!-- Tarjeta 1 -->
        <div class="tarjeta">
            <div class="imagen-casa" style="background-color: #557788;">
                <span class="etiqueta-precio">$10,000</span>
            </div>
            <div class="info-tarjeta">
                <h3>Casa moderna privada</h3>
                <p>Col. Gran Jardin</p>
                
                <div class="etiquetas-servicios">
                    <span>Wifi</span>
                    <span>Parking</span>
                    <span>Mascotas</span>
                </div>

                <a href="#" class="btn-detalles">Ver más detalles</a>
            </div>
        </div>

        <!-- Tarjeta 2 -->
        <div class="tarjeta">
            <div class="imagen-casa" style="background-color: #775566;">
                <span class="etiqueta-precio">$12,000</span>
            </div>
            <div class="info-tarjeta">
                <h3>Departamento en 3er piso</h3>
                <p>Col. Silao</p>
                
                <div class="etiquetas-servicios">
                    <span>Wifi</span>
                    <span>Parking</span>
                    <span>A/C</span>
                </div>

                <a href="#" class="btn-detalles">Ver más detalles</a>
            </div>
        </div>

    </section>

</body>
</html>
