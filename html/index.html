<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <!-- Enlace al archivo CSS externo -->
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>

    <!-- Encabezado sin el icono de perfil -->
    <header>
        <div class="header-logo">NELL<span class="dot">.</span></div>
    </header>

    <!-- Sección de Bienvenida (Hero) -->
    <section class="hero">
        <h1>Bienvenido Usuario</h1>
        <p>Vivienda confiable, cerca de tu universidad, en una sola<br>plataforma para estudiantes foráneos.</p>
    </section>

    <!-- Contenido Principal -->
    <main>
        <!-- Panel Izquierdo: Logo Gigante -->
        <div class="left-panel">
            <div class="large-logo">
                <h2>NELL<span class="dot">.</span></h2>
                <div class="sub-logo">Nest Living Leon</div>
            </div>
        </div>

        <!-- Panel Derecho: Tarjeta de Login -->
        <div class="right-panel">
            <div class="login-card">
                <h3>¿Ya tienes cuenta?</h3>
                
        <form>
            <div class="form-group">
                <label>Correo electronico</label>
                <input type="email" placeholder="correo@ejemplo.com">
            </div>
            
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" placeholder="••••••••">
            </div>
            
        
            <a class="btn-primary" href="inicioEstudiante.html">Iniciar sesion</a>
        </form>

                <div class="new-user-section">
                    <h4>¿Eres nuevo usuario?</h4>
                    <div class="btn-group">
                        <button class="btn-student">Soy estudiante</button>
                        <button class="btn-landlord">Soy arrendador</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
