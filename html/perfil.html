<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NELL - Perfil</title>

    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="icon" href="/favicon/logo.ico">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            NELL.
        </div>

        <nav class="nav-links">
            <a href="inicioEstudiante.html">Inicio</a>
            <a href="#" class="active">Perfil</a>
            <a href="#">Historial</a>
        </nav>

        <div class="user-area">
            <span>Carlos Mendoza</span>
            <div class="avatar-small">CM</div>
        </div>

    </header>


    <main class="container">

        <div class="settings">
            ⚙
        </div>

        <div class="content-layout">

            <!-- TARJETA DE PERFIL -->
            <aside class="profile-card">

                <div class="avatar-large">
                    CM
                </div>

                <h2>Carlos Mendoza</h2>

                <p>Estudiante</p>
                <p>León, Guanajuato</p>

                <div class="separator"></div>

                <p class="member">
                    Miembro desde<br>
                    enero 2022
                </p>

                <p class="contracts">
                    5 contratos totales
                </p>

            </aside>


            <!-- CONTENIDO -->
            <section class="content">

                <!-- INFORMACIÓN PERSONAL -->
                <div class="panel">

                    <h1>Información personal</h1>

                    <div class="form-grid">

                        <div class="field">
                            <label>Nombre</label>
                            <input type="text" value="Carlos">
                        </div>

                        <div class="field">
                            <label>Apellido</label>
                            <input type="text" value="Mendoza">
                        </div>

                        <div class="field full">
                            <label>Correo electronico</label>
                            <input type="email"
                                   value="carlos.mendoza@mail.com">
                        </div>

                        <div class="field full">
                            <label>Telefono</label>
                            <input type="text"
                                   value="477 123 4567">
                        </div>

                        <div class="field full">
                            <label>Ciudad</label>
                            <input type="text"
                                   value="León, Guanajuato">
                        </div>

                        <div class="field full">
                            <label>Universidad cerca</label>
                            <input type="text"
                                   value="Uti">
                        </div>

                    </div>

                    <div class="buttons">

                        <button>
                            Guardar cambios
                        </button>

                        <button>
                            Cancelar
                        </button>

                    </div>

                </div>


                <!-- CONTRASEÑA -->
                <div class="panel password-panel">

                    <h2>Contraseña</h2>

                    <div class="password-grid">

                        <div class="field">
                            <label>Contraseña</label>

                            <input type="password"
                                   value="1234567890123456">
                        </div>

                        <div class="field">
                            <label>Confirmar contraseña</label>

                            <input type="password"
                                   value="1234567890123456">
                        </div>

                    </div>

                    <div class="password-button">

                        <button>
                            Cambiar contraseña
                        </button>

                    </div>

                </div>

            </section>

        </div>

    </main>

</body>
</html>
